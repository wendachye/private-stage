name: private-stage-production

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: private-stage-backend:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
      LOCAL_PREVIEW: "false"
      HOST: 0.0.0.0
      PORT: "3210"
      DATA_DIR: /var/lib/private-stage
      APP_NAME: ${APP_NAME:-Private Stage}
      APP_URL: ${APP_URL:?Set the exact HTTPS backend origin}
      FRONTEND_URL: ${FRONTEND_URL:?Set the exact HTTPS frontend origin}
      SESSION_KEY: ${SESSION_KEY:?Set the private session key}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set the private encryption key}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set the Discord client ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set the private Discord client secret}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set the Discord server ID}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:?Set the Discord owner ID}
      DISCORD_ADMIN_ROLE_IDS: ${DISCORD_ADMIN_ROLE_IDS:-}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set the LiveKit API key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set the private LiveKit API secret}
      MEMBERSHIP_CACHE_SECONDS: ${MEMBERSHIP_CACHE_SECONDS:-60}
      MEMBERSHIP_RECHECK_SECONDS: ${MEMBERSHIP_RECHECK_SECONDS:-60}
      MEMBERSHIP_MAX_STALE_SECONDS: ${MEMBERSHIP_MAX_STALE_SECONDS:-300}
    expose:
      - "3210"
    volumes:
      - stage_data:/var/lib/private-stage
    networks:
      - web
      - media_control
    depends_on:
      livekit:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *bounded-logs

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    stop_grace_period: 30s
    # 7880 is Docker-private only. Never publish or proxy it to participants.
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - type: bind
        source: ./livekit.production.yaml
        target: /etc/livekit.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - media_control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *bounded-logs

  caddy:
    # Tested v2.11.7; digest prevents the major-version tag changing on pull.
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the public API hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *bounded-logs

networks:
  web:
  media_control:

volumes:
  stage_data:
  caddy_data:
  caddy_config:
